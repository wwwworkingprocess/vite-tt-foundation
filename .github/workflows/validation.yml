name: Validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version-file: .node-version }
      - run: corepack enable
      - run: corepack install --global yarn@4.17.1
      - run: |
          node --version
          corepack yarn --version
          corepack yarn audit:runtime
      - run: corepack yarn install --immutable
      - run: corepack yarn validate:portable
      - run: corepack yarn validate:repository
  windows-portability:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version-file: .node-version }
      - run: corepack enable
      - run: corepack install --global yarn@4.17.1
      - run: |
          node --version
          corepack yarn --version
          corepack yarn audit:runtime
      - run: corepack yarn install --immutable
      - run: corepack yarn audit:line-endings
      - run: corepack yarn format:check
      - run: corepack yarn lint
      - run: corepack yarn typecheck
      - run: corepack yarn test
      - run: corepack yarn build
      - run: corepack yarn audit:architecture
      - run: corepack yarn audit:manifest
      - run: corepack yarn audit:build
      - run: corepack yarn validate:repository
      - run: git archive --format=zip --output=foundation-template.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: windows-foundation-template
          path: foundation-template.zip
  linux-archive-portability:
    needs: windows-portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-foundation-template
      - run: unzip foundation-template.zip -d foundation-template
      - uses: actions/setup-node@v6
        with: { node-version-file: foundation-template/.node-version }
      - working-directory: foundation-template
        run: |
          corepack enable
          corepack install --global yarn@4.17.1
          node --version
          corepack yarn --version
          corepack yarn audit:runtime
          corepack yarn install --immutable
          corepack yarn validate:portable
